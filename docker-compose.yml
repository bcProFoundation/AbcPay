services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: abcpay
      POSTGRES_PASSWORD: abcpay
      POSTGRES_DB: abcpay
    volumes:
      - abcpay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U abcpay']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  abcpay_pg_data:
